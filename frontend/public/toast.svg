<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7A4215" flood-opacity="0.15" />
    </filter>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E29D62" />
      <stop offset="100%" stop-color="#C77F42" />
    </linearGradient>
    <linearGradient id="crumbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FAE8C8" />
    </linearGradient>
  </defs>

  <g transform="rotate(-6 50 50)" filter="url(#softGlow)">
    <!-- Outer Crust -->
    <path d="M 28 26 C 28 17, 44 15, 50 23 C 56 15, 72 17, 72 26 C 74 38, 73 64, 70 74 C 68 79, 32 79, 30 74 C 27 64, 26 38, 28 26 Z" 
          fill="url(#crustGrad)" stroke="#B36A2D" stroke-width="1.8" stroke-linejoin="round" />
    
    <!-- Bread Surface -->
    <path d="M 31 28 C 31 20, 44 18, 50 25 C 56 18, 69 20, 69 28 C 71 39, 70 62, 67 71 C 65 75, 35 75, 33 71 C 30 62, 29 39, 31 28 Z" 
          fill="url(#crumbGrad)" />
    
    <!-- Cute Cheeks -->
    <circle cx="39" cy="49" r="4.2" fill="#F8A4A4" opacity="0.8" />
    <circle cx="61" cy="49" r="4.2" fill="#F8A4A4" opacity="0.8" />
    
    <!-- Eyes -->
    <circle cx="42" cy="43.5" r="2.8" fill="#3D2008" />
    <circle cx="42.8" cy="42.5" r="0.9" fill="#FFFFFF" />
    
    <circle cx="58" cy="43.5" r="2.8" fill="#3D2008" />
    <circle cx="58.8" cy="42.5" r="0.9" fill="#FFFFFF" />
    
    <!-- Sweet Smile -->
    <path d="M 47.5 48.5 Q 50 52.5 52.5 48.5" fill="none" stroke="#3D2008" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
